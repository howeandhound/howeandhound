<button id="hazelScrollToTop" style="display: none;" onclick="topFunction()"><i class="fas fa-arrow-up"></i></button>

<script>
    window.onscroll = function() { scrollFunction(); };
    function scrollFunction() {
        if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
            document.getElementById('hazelScrollToTop').style.display = 'block';
        } else {
            document.getElementById('hazelScrollToTop').style.display = 'none';
        }
    }
    function topFunction() {
        document.body.scrollTop = 0;
        document.documentElement.scrollTop = 0;
    }
</script>
